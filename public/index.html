<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olive · OBPAZ Chat</title>
    <link rel="icon" href="/olive/oliveicon.png" />
    <meta name="description" content="Chatbot educativo sobre cultura de paz para escolas." />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel" aria-label="OBPAZ Chat">
        <header class="topbar">
          <div class="brand-mark" aria-hidden="true"><img src="/olive/oliveicon.png" alt="" /></div>
          <div class="title-block">
            <h1>Olive · OBPAZ</h1>
            <p id="status">Carregando serviço</p>
          </div>
          <button type="button" class="profile-pill" id="profileButton" title="Trocar quem está conversando">Perfil</button>
        </header>

        <div class="messages" id="messages" aria-live="polite"></div>

        <div class="suggestions" id="suggestions" aria-label="Sugestões"></div>

        <form class="composer" id="composer">
          <textarea id="messageInput" placeholder="Pergunte sobre paz, conflitos, direitos humanos..." rows="1" maxlength="1200"></textarea>
          <button type="submit" aria-label="Enviar mensagem" title="Enviar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.4 20.4 21 12 3.4 3.6l1.7 6.5 8.8 1.9-8.8 1.9-1.7 6.5Z" />
            </svg>
          </button>
        </form>
        <p class="privacy-note" id="privacyNote" hidden>🔒 As conversas são guardadas <strong>sem nome</strong> para melhorar a Olive e para estudos do NEP/UEPG. Não escreva telefone, endereço ou outros dados pessoais.</p>
      </section>
    </main>
    <aside class="olive-guide" id="oliveGuide" aria-live="polite">
      <div class="olive-bubble" id="oliveBubble">Oi! Eu sou a Olive. Vamos conversar sobre paz?</div>
      <img src="/olive/olivebodynoback.png" alt="Olive, a guia do OBPAZ" />
    </aside>
    <script src="/illustrations.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
